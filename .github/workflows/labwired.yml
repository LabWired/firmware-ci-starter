name: firmware tests

on: [push, pull_request]

jobs:
  labwired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: labwired/firmware-test@v1
        with:
          script: tests/firmware-regression.yaml
